<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 자세 교정 도우미</title>
    <style>
        /* 디자인 스타일 */
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            transition: background-color 0.5s ease;
            color: #333;
        }
        h1 { font-size: 2rem; margin-bottom: 20px; color: #444; }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 500px;
        }
        .start-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            font-weight: bold;
        }
        .start-btn:hover { background-color: #0056b3; transform: scale(1.05); }
        #webcam-container {
            margin-top: 20px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: none;
        }
        canvas { display: block; }
        #label-container { margin-top: 20px; width: 100%; text-align: left; }
        .label-wrapper { margin-bottom: 10px; }
        .label-text { display: flex; justify-content: space-between; margin-bottom: 5px; font-weight: 500; }
        .progress-bg { background-color: #e9ecef; border-radius: 10px; height: 15px; width: 100%; overflow: hidden; }
        .progress-bar { height: 100%; border-radius: 10px; transition: width 0.1s ease; }
    </style>
</head>
<body>

    <div class="container">
        <h1>바른 자세 지킴이</h1>
        <button class="start-btn" type="button" onclick="init()">카메라 켜기</button>
        
        <div id="webcam-container"></div>
        <div id="label-container"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    
    <script type="text/javascript">
        // [설정] Teachable Machine의 클래스 이름과 똑같이 수정하세요!
        const CLASS_NAME_GOOD = "바른자세";
        const CLASS_NAME_BAD = "안좋은자세";

        // [중요] 모델 파일 경로 설정 (같은 폴더에 있으므로 ./)
        const URL = "./"; 

        let model, webcam, labelContainer, maxPredictions;

        async function init() {
            try {
                // 1. 모델 불러오기 시도
                const modelURL = URL + "model.json";
                const metadataURL = URL + "metadata.json";

                // 모델 로딩 로그 출력 (F12 콘솔에서 확인 가능)
                console.log("모델 로딩 시작...");
                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();
                console.log("모델 로딩 성공!");

                // 2. 웹캠 설정 시도
                const flip = true; 
                webcam = new tmImage.Webcam(300, 300, flip);
                
                await webcam.setup(); // 웹캠 권한 요청
                await webcam.play();
                window.requestAnimationFrame(loop);

                // 3. UI 변경 (버튼 숨기고 화면 보이기)
                document.querySelector('.start-btn').style.display = 'none';
                document.getElementById("webcam-container").style.display = 'block';
                document.getElementById("webcam-container").appendChild(webcam.canvas);

                // 4. 라벨 생성
                labelContainer = document.getElementById("label-container");
                for (let i = 0; i < maxPredictions; i++) {
                    const wrapper = document.createElement("div");
                    wrapper.className = "label-wrapper";
                    
                    const textDiv = document.createElement("div");
                    textDiv.className = "label-text";
                    textDiv.innerHTML = `<span>Loading...</span> <span>0%</span>`;
                    
                    const progressBg = document.createElement("div");
                    progressBg.className = "progress-bg";
                    
                    const progressBar = document.createElement("div");
                    progressBar.className = "progress-bar";
                    progressBar.style.width = "0%";
                    progressBar.style.backgroundColor = i === 0 ? "#4caf50" : "#ff5722"; 

                    progressBg.appendChild(progressBar);
                    wrapper.appendChild(textDiv);
                    wrapper.appendChild(progressBg);
                    labelContainer.appendChild(wrapper);
                }

            } catch (error) {
                // [에러 발생 시 경고창 띄우기]
                alert("오류가 발생했습니다!\n\n1. 카메라 권한을 허용했는지 확인해주세요.\n2. 파일 이름이 정확한지 확인해주세요.\n\n에러 내용: " + error);
                console.error(error);
            }
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            
            let maxProbability = 0;
            let currentClass = "";

            for (let i = 0; i < maxPredictions; i++) {
                const className = prediction[i].className;
                const probability = prediction[i].probability.toFixed(2);
                const percentage = Math.round(probability * 100);

                const wrapper = labelContainer.childNodes[i];
                const textDiv = wrapper.querySelector(".label-text");
                const progressBar = wrapper.querySelector(".progress-bar");

                textDiv.innerHTML = `<span>${className}</span> <span>${percentage}%</span>`;
                progressBar.style.width = percentage + "%";

                if (parseFloat(probability) > maxProbability) {
                    maxProbability = parseFloat(probability);
                    currentClass = className;
                }
            }

            handleBackgroundColor(currentClass, maxProbability);
        }

        function handleBackgroundColor(className, probability) {
            const body = document.body;
            if (probability > 0.5) {
                if (className === CLASS_NAME_GOOD) {
                    body.style.backgroundColor = "#d4edda"; // 초록
                } else if (className === CLASS_NAME_BAD) {
                    body.style.backgroundColor = "#f8d7da"; // 빨강
                } else {
                    body.style.backgroundColor = "#f0f2f5";
                }
            } else {
                body.style.backgroundColor = "#f0f2f5";
            }
        }
    </script>
</body>
</html>
